[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-agent-mcp"
version = "0.1.0"
description = "MCP servers for local Windows automation and SearXNG web research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
custom-agent-mcp = "custom_agent_mcp.__main__:main"
custom-agent-websearch-mcp = "custom_agent_mcp.web_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a real Windows desktop session and PyFind capture",
]